[project]
name = "agusta-cli"
version = "0.5.2"
description = "Command line client for AGUSTA"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "AdaptX" },
]
keywords = ["agusta", "soc", "security", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28.1",
    "jmespath>=1.0.1",
    "pydantic>=2.13.4",
    "rich>=14.2.0",
    "typer>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/VptrCipher/Agusta"
Repository = "https://github.com/VptrCipher/Agusta"
Issues = "https://github.com/VptrCipher/Agusta/issues"

[project.scripts]
agusta = "agusta_cli.main:run"

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agusta_cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/agusta_cli/spec/operations.json" = "agusta_cli/spec/operations.json"
